services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maritime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maritime}
      POSTGRES_DB: ${POSTGRES_DB:-maritime}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maritime} -d ${POSTGRES_DB:-maritime}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port: only the api container talks to Postgres, and publishing
    # 5432 would clash with any Postgres already running on the host.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://maritime:maritime@db:5432/maritime?schema=public}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Empty = provider-specific default (see apps/api/src/lib/env.ts)
      LLM_MODEL: ${LLM_MODEL:-}
      SIM_SPEED: ${SIM_SPEED:-120}
      FUEL_PRICE_EUR_PER_T: ${FUEL_PRICE_EUR_PER_T:-600}
      CO2_FACTOR: ${CO2_FACTOR:-3.114}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    # No host port: the web container proxies /api to api:4000 internally.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
